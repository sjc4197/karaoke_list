<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>노래방 리스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #000000;
      --surface-2: #141414;
      --line: rgba(255, 255, 255, .14);
      --line-soft: rgba(255, 255, 255, .08);
      --text: #ffffff;
      --text-2: #9a9a9a;
      --text-3: #6e6e6e;
      --accent: #c6ff3d;
      --accent-soft: rgba(198, 255, 61, .14);
      --danger: #ff5a4f;
      --danger-soft: rgba(255, 90, 79, .14);
      --shadow: none;
      --radius: 4px;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", "Noto Sans JP", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }
    .ja { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Noto Sans KR", sans-serif; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; margin: 0; }

    /* ---------- header ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      padding: calc(14px + env(safe-area-inset-top)) 20px 0;
    }
    .header-inner { max-width: 640px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 14px; padding: 10px 0 16px; }
    .logo { display: block; flex: none; transform-origin: center; animation: logoPulse 5s ease-in-out 1.8s infinite; }
    .logo .ring { stroke-dasharray: 138.3; stroke-dashoffset: 138.3; animation: logoDraw 1s cubic-bezier(.65, 0, .2, 1) .1s forwards; }
    .logo .fill { opacity: 0; animation: logoFill .25s ease-out 1s forwards; }
    .logo .mark { opacity: 0; transform-origin: 24px 24px; animation: logoMark .3s cubic-bezier(.2, .9, .3, 1.3) 1.05s forwards; }
    @keyframes logoDraw { to { stroke-dashoffset: 0; } }
    @keyframes logoFill { to { opacity: 1; } }
    @keyframes logoMark { 0% { opacity: 0; transform: scale(.7); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes logoPulse { 0%, 100% { transform: scale(1); } 3% { transform: scale(1.07); } 6% { transform: scale(1); } }
    .brand-text { flex: 1; min-width: 0; }
    h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
    .total { font-size: 13px; color: var(--text-2); margin-top: 6px; letter-spacing: .02em; }
    .total b { color: var(--text); font-weight: 700; }
    .count { text-align: right; line-height: 1; flex: none; }
    .count b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
    .count span { display: block; font-size: 11px; color: var(--text-2); margin-top: 4px; letter-spacing: .14em; }

    .search { position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .search svg {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; color: var(--text-2); pointer-events: none;
    }
    #search {
      width: 100%; height: 50px;
      font: inherit; font-size: 16px;
      padding: 0 0 0 32px;
      border: 0; border-radius: 0;
      background: transparent;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
    }
    #search::placeholder { color: var(--text-2); }
    #search:focus { box-shadow: inset 0 -2px 0 var(--accent); }
    #search::-webkit-search-cancel-button { -webkit-appearance: none; }

    /* ---------- tabs (전체 / 플레이리스트) ---------- */
    .tabs {
      display: none; gap: 0;
      overflow-x: auto; scrollbar-width: none;
      border-bottom: 1px solid var(--line);
    }
    .tabs.show { display: flex; }
    .tabs::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      display: inline-flex; align-items: center; gap: 6px;
      height: 44px; padding: 0 2px; margin-right: 24px; margin-bottom: -1px;
      border-bottom: 2px solid transparent;
      font-size: 15px; font-weight: 700;
      color: var(--text-2);
      white-space: nowrap; max-width: 220px;
      transition: color .12s, background .12s;
    }
    .chip .label { overflow: hidden; text-overflow: ellipsis; }
    .chip .n { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text-3); }
    .chip.on { color: var(--text); border-bottom-color: var(--accent); }
    .chip.on .n { color: var(--text-2); }
    .chip:active { color: #000; background: #fff; }
    .chip.add { color: var(--text-3); }

    .list-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 16px 0 12px;
    }
    .list-head > div { flex: 1 1 100%; min-width: 0; }
    .list-name { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
    .list-meta { font-family: var(--mono); font-size: 13px; color: var(--text-2); margin-top: 3px; }
    .text-btn {
      flex: none;
      height: 34px; padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, .28); border-radius: 3px;
      font-size: 13px; font-weight: 700; color: var(--text);
      transition: background .12s, color .12s, border-color .12s;
    }
    .text-btn:active { background: #fff; color: #000; border-color: #fff; }
    .text-btn.danger { color: var(--danger); }

    /* ---------- error banner ---------- */
    .error {
      display: none;
      max-width: 640px; margin: 12px auto 0;
      padding: 10px 14px; border-radius: 3px;
      background: var(--danger-soft); color: var(--danger);
      border: 1px solid rgba(255, 90, 79, .4);
      font-size: 14px; font-weight: 500; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .error.show { display: block; }
    .error-wrap { padding: 0 20px; }

    /* ---------- list ---------- */
    main {
      max-width: 640px; margin: 0 auto;
      padding: 0 20px calc(110px + env(safe-area-inset-bottom));
    }
    .artist { border-top: 1px solid var(--line); }
    .artist:last-of-type { border-bottom: 1px solid var(--line); }
    .artist summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 0;
      display: grid;
      grid-template-columns: 1fr auto auto;
      grid-template-rows: auto auto;
      column-gap: 12px;
      align-items: center;
      user-select: none;
      transition: background .12s;
    }
    .artist summary::-webkit-details-marker { display: none; }
    .artist summary:active { background: var(--line-soft); }
    .name {
      grid-column: 1; grid-row: 1;
      font-size: 26px; font-weight: 900; line-height: 1.15;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }
    .name-sub { grid-column: 1; grid-row: 2; font-size: 13px; font-weight: 500; color: var(--text-2); margin-top: 3px; }
    .pill {
      grid-column: 2; grid-row: 1 / span 2;
      font-family: var(--mono); font-size: 14px; font-weight: 500;
      color: var(--text-2);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .chev {
      grid-column: 3; grid-row: 1 / span 2;
      width: 20px; height: 20px; color: var(--text-2);
      transition: transform .2s ease, color .2s;
    }
    details[open] .chev { transform: rotate(180deg); color: var(--text); }

    .artist ul { list-style: none; margin: 0; padding: 0; }
    .song {
      display: flex; align-items: center; gap: 6px;
      min-height: 56px;
      padding: 6px 0;
      border-top: 1px solid var(--line-soft);
    }
    .song-text {
      flex: 1 1 auto; min-width: 0;
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 2px 10px;
    }
    .song-title { font-size: 18px; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
    .song-title small { display: block; font-size: 12px; font-weight: 400; color: var(--text-2); margin-top: 2px; }
    .dam {
      flex: none;
      font-family: var(--mono);
      font-size: 14px; font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--text-2);
      white-space: nowrap;
      margin-left: auto; padding-right: 8px;
    }
    .dam.none { font-family: inherit; font-size: 12px; color: var(--text-3); }

    .song-actions { flex: none; display: flex; align-items: center; gap: 4px; }
    .ibtn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      height: 34px; min-width: 34px;
      border: 1px solid rgba(255, 255, 255, .28); border-radius: 3px;
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 13px; font-weight: 700;
      transition: background .12s, color .12s, border-color .12s;
    }
    .ibtn:active { background: #fff; color: #000; border-color: #fff; }
    .ibtn svg { width: 20px; height: 20px; }
    .ibtn.more { padding: 0; width: 34px; border-color: transparent; color: var(--text-2); }
    .ibtn.more:active { background: #fff; color: #000; }
    .ibtn.lyr.has { border-color: var(--accent); color: var(--accent); }
    .ibtn.lyr.has:active { background: var(--accent); color: #000; }

    .card-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line-soft); }
    .card-foot .text-btn { border-color: transparent; color: var(--danger); }
    .add-row {
      flex: 1; width: 100%;
      display: flex; align-items: center; gap: 6px;
      min-height: 44px; padding-left: 32px;
      background: transparent;
      color: var(--text-2); font-size: 14px; font-weight: 700;
      transition: background .12s, color .12s;
    }
    .add-row:active { background: #fff; color: #000; }
    .add-row svg { width: 16px; height: 16px; }

    .foot {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #000 75%, transparent);
      display: none;
    }
    .foot.show { display: block; }
    .foot .primary { max-width: 640px; margin: 0 auto; }
    .primary {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; height: 56px; border-radius: 4px;
      background: var(--accent); color: #000;
      font-size: 17px; font-weight: 900; letter-spacing: -.01em;
      transition: background .12s;
    }
    .primary:active { background: #fff; }
    .primary svg { width: 18px; height: 18px; }

    mark { background: var(--accent-soft); color: var(--accent); border-radius: 2px; padding: 0 2px; }
    .empty { color: var(--text-2); text-align: center; padding: 48px 12px; font-size: 15px; line-height: 1.7; }

    /* ---------- bottom sheet ---------- */
    dialog.sheet {
      border: 0; padding: 0;
      inset: auto 0 0 0; margin: 0 auto;
      width: 100%; max-width: 640px; max-height: 92dvh;
      background: var(--surface-2); color: var(--text);
      border-top: 1px solid var(--line);
      border-radius: 8px 8px 0 0;
      overflow: hidden;
    }
    dialog.sheet::backdrop { background: rgba(0, 0, 0, .7); }
    .sheet-in {
      max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    }
    .grab { width: 36px; height: 3px; border-radius: 99px; background: rgba(255, 255, 255, .25); margin: 0 auto 16px; }
    .sheet-title { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
    .sheet-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }
    .sheet-head { margin-bottom: 18px; }
    .sheet-err { display: none; margin: 0 0 12px; font-size: 13px; color: var(--danger); overflow-wrap: anywhere; }
    .sheet-err.show { display: block; }

    .field { display: block; margin-bottom: 14px; }
    .field > span { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; letter-spacing: .04em; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .txt {
      width: 100%; font: inherit; font-size: 16px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, .28); border-radius: 3px;
      background: #000; color: var(--text);
      outline: none; -webkit-appearance: none;
    }
    .txt:focus { border-color: var(--accent); }
    .txt::placeholder { color: var(--text-3); }
    .txt:disabled { opacity: .6; }
    .txt[readonly] { color: var(--text-2); }
    textarea.txt { min-height: 220px; resize: vertical; line-height: 1.6; }
    .sheet-btns { display: flex; gap: 10px; margin-top: 18px; }
    .btn {
      flex: 1; min-height: 48px;
      border: 1px solid rgba(255, 255, 255, .28); border-radius: 3px;
      background: transparent; color: var(--text);
      font-size: 15px; font-weight: 700;
      transition: background .12s, color .12s;
    }
    .btn:active { background: #fff; color: #000; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 900; height: auto; }
    .btn.primary:active { background: #fff; border-color: #fff; }
    .btn:disabled { opacity: .55; cursor: default; }

    .menu { display: flex; flex-direction: column; gap: 6px; }
    .menu button {
      display: flex; align-items: center; gap: 10px;
      width: 100%; min-height: 50px; padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, .28); border-radius: 3px;
      background: transparent; color: var(--text);
      font-size: 15px; font-weight: 700; text-align: left;
      transition: background .12s, color .12s;
    }
    .menu button:active { background: #fff; color: #000; }
    .menu button.danger { color: var(--danger); }
    .menu button svg { width: 18px; height: 18px; flex: none; }
    .menu button:disabled { opacity: .55; }
    .menu button .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .menu button .count { font-family: var(--mono); font-size: 13px; color: var(--text-2); font-weight: 500; }
    .menu button.on { border-color: var(--accent); color: var(--accent); }
    .menu button.on .count { color: inherit; opacity: .8; }
    .hint { color: var(--text-2); font-size: 14px; text-align: center; margin: 10px 0 0; }
    .inline-form { display: flex; gap: 8px; margin-top: 14px; }
    .inline-form .txt { flex: 1; min-width: 0; }
    .inline-form .btn { flex: none; padding: 0 16px; }

    /* 전체 곡에서 골라 담기 */
    .pick-artist {
      position: sticky; top: 0; z-index: 1;
      background: var(--surface-2);
      padding: 14px 0 6px;
      font-size: 13px; font-weight: 900; color: var(--text);
      border-bottom: 1px solid var(--line);
    }
    .pick-artist .ko { font-weight: 500; color: var(--text-2); margin-left: 6px; }
    .pick-row {
      display: flex; align-items: center; gap: 12px;
      min-height: 50px; padding: 6px 0;
      cursor: pointer;
      border-bottom: 1px solid var(--line-soft);
      transition: background .12s;
    }
    .pick-row:active { background: var(--line-soft); }
    .pick-row input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; }
    .pbox {
      flex: none; width: 22px; height: 22px; border-radius: 2px;
      border: 1.5px solid rgba(255, 255, 255, .4);
      display: grid; place-items: center;
      transition: background .12s, border-color .12s;
    }
    .pbox svg { width: 14px; height: 14px; color: #000; opacity: 0; transform: scale(.6); transition: opacity .1s, transform .15s; }
    @keyframes snap { 0% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .pick-row input:checked + .pbox { background: var(--accent); border-color: var(--accent); animation: snap .18s cubic-bezier(.2, .9, .3, 1) both; }
    .pick-row input:checked + .pbox svg { opacity: 1; transform: scale(1); }
    .pick-row .song-text { gap: 2px 8px; }
    .pick-row .song-title { font-size: 17px; }
    .sheet-btns.sticky {
      position: sticky; bottom: 0; margin-top: 10px;
      padding: 10px 0 0; background: var(--surface-2);
    }

    /* 가사 보기: 기존 레이아웃 유지 */
    .lyrics { white-space: pre-wrap; line-height: 1.75; font-size: 16px; margin-top: 4px; }
    .lyrics.empty-ly { color: var(--text-3); text-align: center; padding: 24px 0; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="노래방 리스트 로고">
          <circle class="ring" cx="24" cy="24" r="22" fill="none" stroke="#c6ff3d" stroke-width="2" transform="rotate(-90 24 24)"/>
          <circle class="fill" cx="24" cy="24" r="22" fill="#c6ff3d"/>
          <text class="mark ja" x="24" y="25" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="900" fill="#000">歌</text>
        </svg>
        <div class="brand-text">
          <h1>노래방 리스트</h1>
          <div class="total mono" id="total"></div>
        </div>
        <div class="count mono" id="count"></div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="가수 / 곡명 검색" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
  </header>
  <div class="error-wrap"><div class="error" id="error" role="alert"></div></div>
  <main id="list"><p class="empty">불러오는 중…</p></main>
  <div class="foot" id="foot"><button type="button" class="primary" data-act="add-artist">＋ 곡 추가 (새 가수)</button></div>
  <dialog class="sheet" id="sheet"></dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://sadeuuhrnlazabipyvob.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MbQ4ecEbz-nl8STJa6WKVg_LTJSekPH';
    const TABLE = 'songs';
    const T_LISTS = 'playlists';        // { id, name }
    const T_LIST_SONGS = 'playlist_songs'; // { playlist_id, song_id }
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const totalEl = document.getElementById('total');
    const errorEl = document.getElementById('error');
    const tabsEl = document.getElementById('tabs');
    const countEl = document.getElementById('count');
    const footEl = document.getElementById('foot');
    const sheet = document.getElementById('sheet');

    const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
    const LYRIC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>';
    const MORE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
    const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    const TRASH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
    const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

    let songs = [];      // songs 테이블 행 목록
    let playlists = [];  // playlists 테이블 행 목록
    let plSongs = [];    // playlist_songs 테이블 행 목록
    let plReady = false; // 플레이리스트 테이블을 정상적으로 불러왔는지
    let view = 'all';    // 'all' 또는 플레이리스트 id
    let ctx = {};        // 시트에서 다루는 현재 곡
    let forceOpen = null;

    const currentList = () => playlists.find(p => p.id === view) || null;
    const inList = (pid, sid) => plSongs.some(r => r.playlist_id === pid && r.song_id === sid);
    const listCount = pid => plSongs.filter(r => r.playlist_id === pid).length;

    // ---------- errors ----------
    function showError(message, err) {
      console.error(message, err);
      const detail = err && (err.message || err.details || err.hint);
      errorEl.textContent = message + (detail ? ' (' + detail + ')' : '');
      errorEl.classList.add('show');
    }
    function clearError() { errorEl.classList.remove('show'); errorEl.textContent = ''; }
    function sheetError(message, err) {
      console.error(message, err);
      const el = sheet.querySelector('.sheet-err');
      if (!el) return;
      const detail = err && (err.message || err.details || err.hint);
      el.textContent = message + (detail ? ' (' + detail + ')' : '');
      el.classList.add('show');
    }

    // ---------- helpers ----------
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function highlight(text, q) {
      text = text == null ? '' : String(text);
      if (!q) return escapeHtml(text);
      const idx = text.toLowerCase().indexOf(q);
      if (idx < 0) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx)) +
        '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>' +
        escapeHtml(text.slice(idx + q.length));
    }
    const nz = v => (v == null ? '' : String(v)).trim();

    // artist 별로 묶기 (id 순서 유지)
    function groupByArtist(rows) {
      const groups = [];
      for (const s of rows) {
        let g = groups.find(x => x.artist === s.artist);
        if (!g) { g = { artist: s.artist, artist_korean: nz(s.artist_korean), songs: [] }; groups.push(g); }
        if (!g.artist_korean && nz(s.artist_korean)) g.artist_korean = nz(s.artist_korean);
        g.songs.push(s);
      }
      return groups;
    }

    function songMatches(s, q) {
      return nz(s.original_title).toLowerCase().includes(q) ||
        nz(s.title_korean).toLowerCase().includes(q) ||
        nz(s.dam).includes(q);
    }

    // ---------- render ----------
    function songRow(s, q) {
      const dam = nz(s.dam)
        ? `<span class="dam">${highlight(s.dam, q)}</span>`
        : '<span class="dam none">DAM 없음</span>';
      const ko = nz(s.title_korean) ? `<small>${highlight(s.title_korean, q)}</small>` : '';
      return `<li class="song" data-id="${s.id}">
        <div class="song-text">
          <span class="song-title ja">${highlight(s.original_title, q)}${ko}</span>${dam}
        </div>
        <div class="song-actions">
          <button type="button" class="ibtn lyr ${nz(s.lyrics) ? 'has' : ''}" data-act="lyrics">${LYRIC_ICON}<span>가사</span></button>
          <button type="button" class="ibtn more" data-act="more" aria-label="메뉴">${MORE_ICON}</button>
        </div>
      </li>`;
    }

    function card(g, q, isList) {
      const foot = isList ? '' : `
        <div class="card-foot">
          <button type="button" class="add-row" data-act="add-song" data-artist="${escapeHtml(g.artist)}">${PLUS_ICON} 곡 추가</button>
          <button type="button" class="text-btn danger" data-act="del-artist" data-artist="${escapeHtml(g.artist)}">가수 삭제</button>
        </div>`;
      return `
      <details class="artist" data-artist="${escapeHtml(g.artist)}" ${q ? 'open' : ''}>
        <summary>
          <div class="name ja">${highlight(g.artist, q)}</div>
          ${g.artist_korean ? `<div class="name-sub">${highlight(g.artist_korean, q)}</div>` : ''}
          <span class="pill">${g.songs.length}곡</span>
          ${CHEVRON}
        </summary>
        <ul>${g.songs.map(s => songRow(s, q)).join('')}</ul>
        ${foot}
      </details>`;
    }

    function renderTabs() {
      tabsEl.classList.toggle('show', plReady);
      if (!plReady) { tabsEl.innerHTML = ''; return; }
      tabsEl.innerHTML =
        `<button type="button" class="chip ${view === 'all' ? 'on' : ''}" data-view="all"><span class="label">전체</span></button>` +
        playlists.map(p =>
          `<button type="button" class="chip ${view === p.id ? 'on' : ''}" data-view="${p.id}">
            <span class="label">${escapeHtml(p.name)}</span><span class="n">${listCount(p.id)}</span>
          </button>`).join('') +
        `<button type="button" class="chip add" data-act="new-list">＋ 새 리스트</button>`;
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const openSet = new Set([...listEl.querySelectorAll('details[open]')].map(d => d.dataset.artist));
      if (view !== 'all' && !currentList()) view = 'all';
      const list = currentList();
      renderTabs();

      // 현재 뷰의 곡 (전체 또는 플레이리스트에 담긴 곡만)
      let rows = songs;
      if (list) {
        const ids = new Set(plSongs.filter(r => r.playlist_id === list.id).map(r => r.song_id));
        rows = songs.filter(s => ids.has(s.id));
      }
      const groups = groupByArtist(rows);

      const shown = [];
      for (const g of groups) {
        const artistHit = g.artist.toLowerCase().includes(q) || g.artist_korean.toLowerCase().includes(q);
        const gs = q && !artistHit ? g.songs.filter(s => songMatches(s, q)) : g.songs;
        if (q && gs.length === 0 && !artistHit) continue;
        shown.push({ ...g, songs: gs });
      }

      let html = '';
      if (list) {
        html += `<div class="list-head">
          <div><div class="list-name">${escapeHtml(list.name)}</div><div class="list-meta">${rows.length}곡</div></div>
          <button type="button" class="text-btn" data-act="bulk-pick">곡 담기</button>
          <button type="button" class="text-btn" data-act="list-rename">이름 변경</button>
          <button type="button" class="text-btn danger" data-act="list-delete">삭제</button>
        </div>`;
      }
      if (rows.length === 0) {
        html += list
          ? '<p class="empty">아직 담긴 곡이 없습니다.<br>위의 "곡 담기"로 전체 곡에서 골라 담거나,<br>전체 탭에서 곡 옆 ⋯ → 플레이리스트에 담기</p>'
          : '<p class="empty">등록된 곡이 없습니다.<br>아래 버튼으로 첫 곡을 추가해 보세요.</p>';
      } else if (shown.length === 0) {
        html += '<p class="empty">검색 결과가 없습니다.</p>';
      } else {
        html += shown.map(g => card(g, q, !!list)).join('');
      }
      footEl.classList.toggle('show', !list);
      listEl.innerHTML = html;

      for (const d of listEl.querySelectorAll('details')) {
        if (openSet.has(d.dataset.artist) || forceOpen === d.dataset.artist) d.open = true;
      }
      forceOpen = null;
      totalEl.innerHTML = list
        ? '<b>' + rows.length + '</b>곡 담김'
        : '<b>' + groups.length + '</b>명 · ' + songs.length + '곡';
      countEl.innerHTML = '<b>' + rows.length + '</b><span>SONGS</span>';
    }

    // ---------- data ----------
    async function loadSongs() {
      const { data, error } = await db.from(TABLE).select('*').order('id', { ascending: true });
      if (error) {
        showError('곡 목록을 불러오지 못했습니다.', error);
        listEl.innerHTML = '<p class="empty">목록을 불러오지 못했습니다.<br>새로고침 해 보세요.</p>';
        return;
      }
      clearError();
      songs = data || [];
      render();
    }

    async function insertSong(row) {
      const { data, error } = await db.from(TABLE).insert(row).select().single();
      if (error) throw error;
      songs.push(data);
    }
    async function updateLyrics(id, lyrics) {
      const { data, error } = await db.from(TABLE).update({ lyrics }).eq('id', id).select().single();
      if (error) throw error;
      const i = songs.findIndex(s => s.id === id);
      if (i >= 0) songs[i] = data;
    }
    async function deleteSong(id) {
      const { error } = await db.from(TABLE).delete().eq('id', id);
      if (error) throw error;
      songs = songs.filter(s => s.id !== id);
      plSongs = plSongs.filter(r => r.song_id !== id); // DB 쪽은 on delete cascade
    }
    // 가수 삭제 = 그 가수의 곡 전부 삭제 (가수는 곡의 artist 값으로만 존재)
    async function deleteArtist(artist) {
      const { error } = await db.from(TABLE).delete().eq('artist', artist);
      if (error) throw error;
      const ids = new Set(songs.filter(s => s.artist === artist).map(s => s.id));
      songs = songs.filter(s => !ids.has(s.id));
      plSongs = plSongs.filter(r => !ids.has(r.song_id));
    }

    // ----- 플레이리스트 -----
    async function loadPlaylists() {
      const r1 = await db.from(T_LISTS).select('*').order('id', { ascending: true });
      if (r1.error) throw r1.error;
      const r2 = await db.from(T_LIST_SONGS).select('*');
      if (r2.error) throw r2.error;
      playlists = r1.data || [];
      plSongs = r2.data || [];
      plReady = true;
    }
    async function createPlaylist(name) {
      const { data, error } = await db.from(T_LISTS).insert({ name }).select().single();
      if (error) throw error;
      playlists.push(data);
      return data;
    }
    async function renamePlaylist(id, name) {
      const { error } = await db.from(T_LISTS).update({ name }).eq('id', id);
      if (error) throw error;
      const p = playlists.find(x => x.id === id);
      if (p) p.name = name;
    }
    async function deletePlaylist(id) {
      const { error } = await db.from(T_LISTS).delete().eq('id', id);
      if (error) throw error;
      playlists = playlists.filter(x => x.id !== id);
      plSongs = plSongs.filter(r => r.playlist_id !== id);
    }
    async function addToPlaylist(pid, sid) {
      if (inList(pid, sid)) return;
      const { error } = await db.from(T_LIST_SONGS).insert({ playlist_id: pid, song_id: sid });
      if (error) throw error;
      plSongs.push({ playlist_id: pid, song_id: sid });
    }
    async function removeFromPlaylist(pid, sid) {
      const { error } = await db.from(T_LIST_SONGS).delete().eq('playlist_id', pid).eq('song_id', sid);
      if (error) throw error;
      plSongs = plSongs.filter(r => !(r.playlist_id === pid && r.song_id === sid));
    }
    // 리스트의 곡을 선택한 집합으로 맞추기 (추가분 insert, 빠진 분 delete)
    async function setPlaylistSongs(pid, ids) {
      const want = new Set(ids);
      const have = new Set(plSongs.filter(r => r.playlist_id === pid).map(r => r.song_id));
      const toAdd = [...want].filter(id => !have.has(id));
      const toRemove = [...have].filter(id => !want.has(id));
      if (toAdd.length) {
        const { error } = await db.from(T_LIST_SONGS).insert(toAdd.map(song_id => ({ playlist_id: pid, song_id })));
        if (error) throw error;
        for (const song_id of toAdd) plSongs.push({ playlist_id: pid, song_id });
      }
      if (toRemove.length) {
        const { error } = await db.from(T_LIST_SONGS).delete().eq('playlist_id', pid).in('song_id', toRemove);
        if (error) throw error;
        plSongs = plSongs.filter(r => !(r.playlist_id === pid && toRemove.includes(r.song_id)));
      }
    }

    // ---------- bottom sheet ----------
    function openSheet(html) {
      sheet.innerHTML = '<div class="sheet-in"><div class="grab"></div>' + html + '</div>';
      if (!sheet.open) sheet.showModal();
      sheet.querySelector('.sheet-in').scrollTop = 0;
    }
    function closeSheet() { if (sheet.open) sheet.close(); }
    function sheetHead(title, sub, ja) {
      return `<div class="sheet-head"><h2 class="sheet-title ${ja ? 'ja' : ''}">${escapeHtml(title)}</h2>${sub ? `<div class="sheet-sub">${escapeHtml(sub)}</div>` : ''}</div><p class="sheet-err"></p>`;
    }
    function setBusy(busy) {
      for (const el of sheet.querySelectorAll('button, input, textarea')) el.disabled = busy;
    }
    const songById = id => songs.find(s => s.id === Number(id));

    // ----- 곡 추가 -----
    function openAddSong(artist) {
      const g = artist ? groupByArtist(songs).find(x => x.artist === artist) : null;
      const fixed = !!g;
      openSheet(sheetHead('곡 추가', fixed ? artist : '') + `
        <form data-form="add-song">
          <div class="row2">
            <label class="field"><span>가수 (일본어)</span><input class="txt ja" name="artist" required autocomplete="off" value="${escapeHtml(fixed ? g.artist : '')}" ${fixed ? 'readonly' : ''} placeholder="米津玄師"></label>
            <label class="field"><span>가수 (한국어)</span><input class="txt" name="artist_korean" autocomplete="off" value="${escapeHtml(fixed ? g.artist_korean : '')}" ${fixed ? 'readonly' : ''} placeholder="요네즈 켄시"></label>
          </div>
          <label class="field"><span>곡명 (일본어)</span><input class="txt ja" name="original_title" required autocomplete="off"></label>
          <label class="field"><span>곡명 (한국어, 선택)</span><input class="txt" name="title_korean" autocomplete="off"></label>
          <label class="field"><span>DAM 번호 (선택)</span><input class="txt" name="dam" autocomplete="off" inputmode="numeric" placeholder="0000-00"></label>
          <div class="sheet-btns">
            <button type="button" class="btn" data-act="close">취소</button>
            <button type="submit" class="btn primary">추가</button>
          </div>
        </form>`);
      const first = sheet.querySelector(fixed ? 'input[name=original_title]' : 'input[name=artist]');
      if (first) first.focus();
    }

    // ----- 가사 -----
    function openLyrics(id) {
      const s = songById(id); if (!s) return;
      ctx = { id: s.id };
      if (nz(s.lyrics)) showLyricsView(); else showLyricsEdit();
    }
    function showLyricsView() {
      const s = songById(ctx.id); if (!s) return;
      openSheet(sheetHead(s.original_title, s.artist, true) +
        `<div class="lyrics ja">${escapeHtml(s.lyrics)}</div>
        <div class="sheet-btns">
          <button type="button" class="btn" data-act="close">닫기</button>
          <button type="button" class="btn primary" data-act="lyrics-edit">편집</button>
        </div>`);
    }
    function showLyricsEdit() {
      const s = songById(ctx.id); if (!s) return;
      const has = nz(s.lyrics) !== '';
      openSheet(sheetHead(s.original_title, s.artist + ' · 가사 편집', true) + `
        <form data-form="lyrics">
          <label class="field"><span>가사</span><textarea class="txt ja" name="lyrics" placeholder="일본어 가사와 한국어 발음을 붙여넣기">${escapeHtml(s.lyrics)}</textarea></label>
          <div class="sheet-btns">
            <button type="button" class="btn" data-act="${has ? 'lyrics-view' : 'close'}">취소</button>
            <button type="submit" class="btn primary">저장</button>
          </div>
        </form>`);
    }

    // ----- 곡 메뉴 (⋯) -----
    function openMore(id) {
      const s = songById(id); if (!s) return;
      ctx = { id: s.id };
      const list = currentList();
      openSheet(sheetHead(s.original_title, s.artist, true) + `
        <div class="menu">
          ${plReady ? `<button type="button" data-act="pick-list">${PLUS_ICON}<span class="label">플레이리스트에 담기</span></button>` : ''}
          ${list ? `<button type="button" data-act="remove-from-list"><span class="label">「${escapeHtml(list.name)}」에서 빼기</span></button>` : ''}
          <button type="button" class="danger" data-act="del-song">${TRASH_ICON}<span class="label">곡 삭제</span></button>
        </div>`);
    }

    // ----- 플레이리스트에 담기 -----
    function showPickList() {
      const s = songById(ctx.id); if (!s) return;
      const items = playlists.map(p => {
        const on = inList(p.id, s.id);
        return `<button type="button" class="${on ? 'on' : ''}" data-act="toggle-list" data-id="${p.id}">
          <span class="label">${escapeHtml(p.name)}</span><span class="count">${listCount(p.id)}곡</span>${on ? CHECK_ICON : ''}
        </button>`;
      }).join('');
      openSheet(sheetHead('플레이리스트에 담기', s.original_title, false) + `
        <div class="menu">${items}</div>
        ${playlists.length === 0 ? '<p class="hint">아직 플레이리스트가 없습니다. 아래에서 만들어 보세요.</p>' : ''}
        <form class="inline-form" data-form="new-list-add">
          <input class="txt" name="name" required autocomplete="off" placeholder="새 리스트 이름">
          <button type="submit" class="btn primary">만들기</button>
        </form>
        <div class="sheet-btns"><button type="button" class="btn" data-act="close">완료</button></div>`);
    }

    function openNewList() {
      openSheet(sheetHead('새 플레이리스트') + `
        <form data-form="new-list">
          <label class="field"><span>리스트 이름</span><input class="txt" name="name" required autocomplete="off"></label>
          <div class="sheet-btns">
            <button type="button" class="btn" data-act="close">취소</button>
            <button type="submit" class="btn primary">만들기</button>
          </div>
        </form>`);
      sheet.querySelector('input[name=name]').focus();
    }
    // ----- 전체 곡에서 골라 담기 -----
    function showBulkPick() {
      const list = currentList(); if (!list) return;
      const groups = groupByArtist(songs);
      const body = groups.map(g => `
        <div class="pick-artist ja">${escapeHtml(g.artist)}${g.artist_korean ? `<span class="ko">${escapeHtml(g.artist_korean)}</span>` : ''}</div>
        ${g.songs.map(s => `
          <label class="pick-row">
            <input type="checkbox" name="song" value="${s.id}" ${inList(list.id, s.id) ? 'checked' : ''}>
            <span class="pbox">${CHECK_ICON}</span>
            <span class="song-text"><span class="song-title ja">${escapeHtml(s.original_title)}</span>${nz(s.dam) ? `<span class="dam">${escapeHtml(s.dam)}</span>` : ''}</span>
          </label>`).join('')}`).join('');
      openSheet(sheetHead(`「${list.name}」에 담기`, `${listCount(list.id)}곡 선택`) + `
        <form data-form="bulk-pick">
          ${songs.length ? body : '<p class="hint">등록된 곡이 없습니다.</p>'}
          <div class="sheet-btns sticky">
            <button type="button" class="btn" data-act="close">취소</button>
            <button type="submit" class="btn primary">저장</button>
          </div>
        </form>`);
    }
    function updatePickCount() {
      const n = sheet.querySelectorAll('form[data-form="bulk-pick"] input[name=song]:checked').length;
      const sub = sheet.querySelector('.sheet-sub');
      if (sub) sub.textContent = n + '곡 선택';
    }

    function openRenameList() {
      const list = currentList(); if (!list) return;
      openSheet(sheetHead('리스트 이름 변경') + `
        <form data-form="rename-list">
          <label class="field"><span>리스트 이름</span><input class="txt" name="name" required autocomplete="off" value="${escapeHtml(list.name)}"></label>
          <div class="sheet-btns">
            <button type="button" class="btn" data-act="close">취소</button>
            <button type="submit" class="btn primary">저장</button>
          </div>
        </form>`);
      sheet.querySelector('input[name=name]').focus();
    }

    // ---------- form handlers ----------
    const forms = {
      async 'add-song'(fd, form) {
        const row = {
          artist: nz(fd.get('artist')),
          artist_korean: nz(fd.get('artist_korean')) || null,
          original_title: nz(fd.get('original_title')),
          title_korean: nz(fd.get('title_korean')) || null,
          dam: nz(fd.get('dam')) || null,
          lyrics: null,
        };
        if (!row.artist || !row.original_title) return;
        if (songs.some(s => s.artist === row.artist && nz(s.original_title).toLowerCase() === row.original_title.toLowerCase())) {
          sheetError('이미 등록된 곡입니다.'); return;
        }
        setBusy(true);
        try {
          await insertSong(row);
          clearError();
          forceOpen = row.artist;
          closeSheet(); render();
        } catch (err) {
          setBusy(false);
          sheetError('곡을 추가하지 못했습니다.', err);
        }
      },
      async 'lyrics'(fd) {
        const lyrics = (fd.get('lyrics') || '').replace(/\r/g, '').trim() || null;
        setBusy(true);
        try {
          await updateLyrics(ctx.id, lyrics);
          clearError();
          closeSheet(); render();
        } catch (err) {
          setBusy(false);
          sheetError('가사를 저장하지 못했습니다.', err);
        }
      },
      async 'new-list'(fd) {
        const name = nz(fd.get('name'));
        if (!name) return;
        setBusy(true);
        try {
          const p = await createPlaylist(name);
          clearError();
          view = p.id;
          closeSheet(); render();
        } catch (err) {
          setBusy(false);
          sheetError('리스트를 만들지 못했습니다.', err);
        }
      },
      async 'new-list-add'(fd) {
        const name = nz(fd.get('name'));
        if (!name) return;
        setBusy(true);
        try {
          const p = await createPlaylist(name);
          await addToPlaylist(p.id, ctx.id);
          clearError();
          render(); showPickList();
        } catch (err) {
          setBusy(false);
          sheetError('리스트를 만들지 못했습니다.', err);
        }
      },
      async 'bulk-pick'(fd) {
        const list = currentList(); if (!list) return;
        const ids = fd.getAll('song').map(Number);
        setBusy(true);
        try {
          await setPlaylistSongs(list.id, ids);
          clearError();
          closeSheet(); render();
        } catch (err) {
          setBusy(false);
          sheetError('플레이리스트를 저장하지 못했습니다.', err);
        }
      },
      async 'rename-list'(fd) {
        const list = currentList(); if (!list) return;
        const name = nz(fd.get('name'));
        if (!name) return;
        setBusy(true);
        try {
          await renamePlaylist(list.id, name);
          clearError();
          closeSheet(); render();
        } catch (err) {
          setBusy(false);
          sheetError('이름을 바꾸지 못했습니다.', err);
        }
      },
    };

    const actions = {
      close: closeSheet,
      'lyrics-edit': showLyricsEdit,
      'lyrics-view': showLyricsView,
      'pick-list': showPickList,
      async 'toggle-list'(btn) {
        const pid = Number(btn.dataset.id);
        setBusy(true);
        try {
          if (inList(pid, ctx.id)) await removeFromPlaylist(pid, ctx.id);
          else await addToPlaylist(pid, ctx.id);
          clearError();
          render(); showPickList();
        } catch (err) {
          setBusy(false);
          sheetError('플레이리스트를 저장하지 못했습니다.', err);
        }
      },
      async 'remove-from-list'() {
        const list = currentList(); if (!list) return;
        setBusy(true);
        try {
          await removeFromPlaylist(list.id, ctx.id);
          clearError();
          closeSheet(); render();
        } catch (err) {
          setBusy(false);
          sheetError('리스트에서 빼지 못했습니다.', err);
        }
      },
      async 'del-song'() {
        const s = songById(ctx.id); if (!s) return;
        if (!confirm(`「${s.original_title}」을(를) 삭제할까요?`)) return;
        setBusy(true);
        try {
          await deleteSong(s.id);
          clearError();
          closeSheet(); render();
        } catch (err) {
          setBusy(false);
          sheetError('곡을 삭제하지 못했습니다.', err);
        }
      },
    };

    sheet.addEventListener('click', e => {
      if (e.target === sheet) { closeSheet(); return; }
      const btn = e.target.closest('[data-act]');
      if (btn && actions[btn.dataset.act]) actions[btn.dataset.act](btn);
    });
    sheet.addEventListener('submit', e => {
      e.preventDefault();
      const h = forms[e.target.dataset.form];
      if (h) h(new FormData(e.target), e.target);
    });
    sheet.addEventListener('change', e => {
      if (e.target.name === 'song') updatePickCount();
    });

    listEl.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const li = btn.closest('li.song');
      switch (btn.dataset.act) {
        case 'add-song': openAddSong(btn.dataset.artist || ''); break;
        case 'del-artist': {
          const artist = btn.dataset.artist;
          const n = songs.filter(s => s.artist === artist).length;
          if (!confirm(`「${artist}」 안에 노래가 ${n}곡 들어있습니다.\n전체 다 삭제하겠습니까?`)) return;
          deleteArtist(artist)
            .then(() => { clearError(); render(); })
            .catch(err => showError('가수를 삭제하지 못했습니다.', err));
          break;
        }
        case 'lyrics': openLyrics(li.dataset.id); break;
        case 'more': openMore(li.dataset.id); break;
        case 'bulk-pick': showBulkPick(); break;
        case 'list-rename': openRenameList(); break;
        case 'list-delete': {
          const list = currentList(); if (!list) return;
          if (!confirm(`「${list.name}」 리스트를 삭제할까요? (곡 자체는 지워지지 않습니다)`)) return;
          deletePlaylist(list.id)
            .then(() => { clearError(); view = 'all'; render(); })
            .catch(err => showError('리스트를 삭제하지 못했습니다.', err));
          break;
        }
      }
    });

    footEl.addEventListener('click', e => {
      if (e.target.closest('[data-act="add-artist"]')) openAddSong('');
    });

    tabsEl.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.act === 'new-list') { openNewList(); return; }
      if (!btn.dataset.view) return;
      const next = btn.dataset.view === 'all' ? 'all' : Number(btn.dataset.view);
      if (next !== view) { view = next; render(); }
    });

    searchEl.addEventListener('input', render);

    (async function init() {
      await loadSongs();
      if (songs.length === 0 && errorEl.classList.contains('show')) return; // 곡 목록 자체를 못 불러온 경우
      try {
        await loadPlaylists();
      } catch (err) {
        plReady = false;
        showError('플레이리스트 테이블을 불러오지 못했습니다. schema.sql 을 Supabase SQL Editor 에서 실행하면 플레이리스트 기능이 켜집니다.', err);
      }
      render();
    })();
  </script>
</body>
</html>
