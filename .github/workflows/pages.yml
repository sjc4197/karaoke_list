name: Deploy to GitHub Pages

# main 에 푸시하면 내용을 그대로 gh-pages 브랜치에 복사합니다.
# GitHub Pages 는 gh-pages 브랜치를 소스로 사이트를 배포합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
